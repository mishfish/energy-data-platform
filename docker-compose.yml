name: energy-data-platform

x-ingest-image: &ingest-image
  build:
    context: .
    args:
      SERVICE: ingest
  image: energy-data-platform-ingest

x-database-url: &database-url postgres://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/${POSTGRES_DB:-energy}?sslmode=disable

services:
  postgres:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy}
      POSTGRES_DB: ${POSTGRES_DB:-energy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Single-node KRaft (combined broker + controller) for local dev.
  kafka:
    image: confluentinc/cp-kafka:8.2.4
    environment:
      CLUSTER_ID: QwvGuX83Q1qANRRW2XiAbw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      start_period: 20s
      retries: 10

  # One-shot schema migration (ADR 0013); ingest starts only after it exits 0.
  migrate:
    <<: *ingest-image
    command: ["migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingest:
    <<: *ingest-image
    environment:
      INGEST_HTTP_ADDR: :8080
      DATABASE_URL: *database-url
      # Required: ingest exits at startup when the token is empty.
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:-}
      ENTSOE_BASE_URL: ${ENTSOE_BASE_URL:-}
      INGEST_DAY_AHEAD_INTERVAL: ${INGEST_DAY_AHEAD_INTERVAL:-}
      INGEST_DAY_AHEAD_LOOK_BACK: ${INGEST_DAY_AHEAD_LOOK_BACK:-}
      INGEST_DAY_AHEAD_LOOK_AHEAD: ${INGEST_DAY_AHEAD_LOOK_AHEAD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${INGEST_PORT:-8080}:8080"
    # Longer than the service's 10s shutdown timeout, so a drain finishes before SIGKILL.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      # Local dev only: anonymous admin, no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
