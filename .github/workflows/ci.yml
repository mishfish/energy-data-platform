name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...
      # Pull the testcontainers images before the tests: a pull that fails inside testcontainers only
      # surfaced as "No such image" at container create (Apicurio from quay.io). Here a failing pull
      # fails the step with the registry's own error. The list is read from the tests, so it cannot drift.
      - name: Pull integration test images
        run: |
          grep -rhoE '"(postgres|clickhouse/clickhouse-server|confluentinc/confluent-local|quay\.io/apicurio/apicurio-registry):[^"]+"' \
            --include='*_integration_test.go' . | tr -d '"' | sort -u | while read -r image; do
            docker pull --quiet "$image"
          done
      # testcontainers uses the runner's Docker daemon.
      - run: go test -race -tags=integration ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # Python dashboard (ADR 0032): ruff and unit tests. The page smoke tests need ClickHouse and skip here.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: analytics/dashboard/uv.lock
      - name: Lint and test the dashboard
        run: make test-dashboard
        env:
          UV_FROZEN: "1" # install exactly uv.lock, never re-lock

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Test Prometheus rules
        run: make test-rules
      - name: Build service images
        run: docker compose build
