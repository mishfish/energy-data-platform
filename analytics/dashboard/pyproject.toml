[project]
name = "energy-dashboard"
version = "0.1.0"
description = "Streamlit analytics on the ClickHouse CDC tables (ADR 0032)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "clickhouse-connect>=0.11",
    "pandas>=2.2",
    "streamlit>=1.66,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
