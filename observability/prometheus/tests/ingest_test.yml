# Unit tests for rules/ingest.yml. Run with: make test-rules
rule_files:
  - ../rules/ingest.yml

evaluation_interval: 1m

tests:
  - name: healthy ingest does not alert
    interval: 1m
    input_series:
      - series: 'up{job="ingest"}'
        values: '1x120'
      - series: 'ingest_job_info{dataset="day_ahead_price", zone="NL", job="ingest"}'
        values: '1x120'
      - series: 'ingest_job_info{dataset="actual_load", zone="DE_LU", job="ingest"}'
        values: '1x120'
      # A successful run every 15 minutes: the gauge jumps by 900 s every 15 samples.
      - series: 'ingest_last_success_timestamp_seconds{dataset="day_ahead_price", zone="NL", job="ingest"}'
        values: '0x14 900x14 1800x14 2700x14 3600x14 4500x14 5400x14 6300x14'
      - series: 'ingest_last_success_timestamp_seconds{dataset="actual_load", zone="DE_LU", job="ingest"}'
        values: '0x14 900x14 1800x14 2700x14 3600x14 4500x14 5400x14 6300x14'
    alert_rule_test:
      - eval_time: 100m
        alertname: IngestStale
      - eval_time: 100m
        alertname: IngestNeverSucceeded
      - eval_time: 100m
        alertname: IngestDown

  - name: one zone keeps failing while the others are fresh
    interval: 1m
    input_series:
      - series: 'up{job="ingest"}'
        values: '1x120'
      # NL succeeded once at t=0 and then only fails; BE stays fresh.
      - series: 'ingest_last_success_timestamp_seconds{dataset="day_ahead_price", zone="NL", job="ingest"}'
        values: '0x120'
      - series: 'ingest_last_success_timestamp_seconds{dataset="day_ahead_price", zone="BE", job="ingest"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 45m
        alertname: IngestStale
      - eval_time: 46m
        alertname: IngestStale
        exp_alerts:
          - exp_labels:
              severity: critical
              dataset: day_ahead_price
              zone: NL
            exp_annotations:
              summary: "No successful day_ahead_price fetch for NL for 46m 0s"
              description: >-
                The ingest service has not fetched and stored day_ahead_price for NL for more
                than 45 minutes (three missed runs at the default 15-minute interval). Check ingest_fetches_total by
                result and the ingest logs: fetch_error points at the source API or the token, store_error at Postgres.

  - name: a configured zone never succeeds
    interval: 1m
    input_series:
      - series: 'up{job="ingest"}'
        values: '1x120'
      - series: 'ingest_job_info{dataset="actual_load", zone="NL", job="ingest"}'
        values: '1x120'
      - series: 'ingest_job_info{dataset="actual_load", zone="IE_SEM", job="ingest"}'
        values: '1x120'
      - series: 'ingest_last_success_timestamp_seconds{dataset="actual_load", zone="NL", job="ingest"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 44m
        alertname: IngestNeverSucceeded
      - eval_time: 46m
        alertname: IngestNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              dataset: actual_load
              zone: IE_SEM
            exp_annotations:
              summary: "No successful actual_load fetch for IE_SEM on record"
              description: >-
                The actual_load job for IE_SEM has run for 45 minutes without a single successful
                fetch. If the source answers no_data for this zone permanently, remove the zone from the
                INGEST_*_ZONES list.

  - name: ingest process stopped
    interval: 1m
    input_series:
      # Last success at t=0, the target goes down after 10 minutes.
      - series: 'up{job="ingest"}'
        values: '1x10 0x110'
      - series: 'ingest_job_info{dataset="day_ahead_price", zone="NL", job="ingest"}'
        values: '1x10 stale'
      - series: 'ingest_last_success_timestamp_seconds{dataset="day_ahead_price", zone="NL", job="ingest"}'
        values: '0x10 stale'
    alert_rule_test:
      - eval_time: 15m
        alertname: IngestDown
      - eval_time: 16m
        alertname: IngestDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ingest
            exp_annotations:
              summary: "The ingest service is down"
              description: >-
                Prometheus has not scraped the ingest service for 5 minutes, so no zone is being fetched.
                Check docker compose ps ingest and its logs.
      - eval_time: 46m
        alertname: IngestStale
        exp_alerts:
          - exp_labels:
              severity: critical
              dataset: day_ahead_price
              zone: NL
            exp_annotations:
              summary: "No successful day_ahead_price fetch for NL for 46m 0s"
              description: >-
                The ingest service has not fetched and stored day_ahead_price for NL for more
                than 45 minutes (three missed runs at the default 15-minute interval). Check ingest_fetches_total by
                result and the ingest logs: fetch_error points at the source API or the token, store_error at Postgres.
      # job_info went stale with the process, so there is no never-succeeded alert on top.
      - eval_time: 100m
        alertname: IngestNeverSucceeded
