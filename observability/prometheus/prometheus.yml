global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: ingest
    static_configs:
      - targets: ["ingest:8080"]
  # Kafka/Connect JMX exporters and postgres_exporter are added as they land (M2).
