global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: ingest
    static_configs:
      - targets: ["ingest:8080"]
  - job_name: sink
    static_configs:
      - targets: ["sink:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  # Kafka/Connect JMX exporters are not scraped yet: slot metrics cover a stopped connector (ADR 0023).
