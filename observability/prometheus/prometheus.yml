global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: ingest
    static_configs:
      - targets: ["ingest:8080"]
  - job_name: sink
    static_configs:
      - targets: ["sink:8080"]
  # The Streamlit dashboard has no /metrics; blackbox_exporter probes its health endpoint (ADR 0033).
  # probe_success is the app's state; up{job="dashboard"} only says the exporter answered.
  - job_name: dashboard
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://dashboard:8501/_stcore/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  # Kafka/Connect JMX exporters are not scraped yet: slot metrics cover a stopped connector (ADR 0023).
