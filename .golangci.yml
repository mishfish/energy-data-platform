version: "2"

run:
  # Lint integration tests too; they are behind a build tag.
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - misspell
    - revive
  exclusions:
    presets:
      - comments
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mishfish/energy-data-platform
